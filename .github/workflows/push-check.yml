name: schedule-push-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: push-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        working-directory: scripts/push-check
        # npmのキャッシュが古い情報を持っていて失敗することがあるため、キャッシュを捨てつつ数回まで再試行する
        run: |
          for i in 1 2 3 4 5; do
            npm install && exit 0
            echo "npm install failed (try $i), clearing cache and retrying..."
            npm cache clean --force
            sleep 10
          done
          npm install
      - name: check and send
        working-directory: scripts/push-check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node check-and-push.mjs
